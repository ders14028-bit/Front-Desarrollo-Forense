# Toda la configuración sensible sale de variables de entorno. Nada de esto contiene secretos.
spring:
  task:
    scheduling:
      pool:
        size: 3   # la carga inicial de Wazuh puede tardar y no debe frenar el refresco del resumen
  application:
    name: dashboard-soc-backend
  main:
    banner-mode: off
  mvc:
    log-request-details: false

server:
  # Solo escucha en la máquina local, salvo que se indique otra dirección (SERVER_ADDRESS).
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

dashboard:
  thehive:
    url: ${THEHIVE_URL:}                      # obligatoria, por ejemplo https://servidor:puerto
    api-key: ${THEHIVE_API_KEY:}              # obligatoria; NUNCA en este archivo
    organizacion: ${THEHIVE_ORG:escuelaing}   # fija: se envía en X-Organisation y el frontend no puede cambiarla
    limites:
      timeout-conexion: 5s
      timeout-lectura: 15s
      max-respuesta: 20MB        # una respuesta más grande se descarta: una consulta mal armada no debe tumbar la app
      max-consultas-simultaneas: 4
  cors:
    origenes: ${DASHBOARD_ORIGINS:http://localhost:5173}   # varios, separados por comas
  # SLA de atención en minutos por severidad (CLAUDE.md). Se expone en GET /api/dashboard/configuracion.
  sla-minutos:
    critica: 15
    alta: 30
    media: 120
    baja: 240
  # Nombres de TheHive de las reglas de negocio. Los marcados PENDIENTE hay que confirmarlos con el grupo de TheHive.
  negocio:
    grupo-contencion: Contención            # PENDIENTE confirmar
    estado-caso-confirmado: TruePositive    # PENDIENTE confirmar
    estado-tarea-completada: Completed      # PENDIENTE confirmar
    etapa-caso-nuevo: New                   # PENDIENTE confirmar
    etapa-caso-en-progreso: InProgress      # PENDIENTE confirmar
    etapa-caso-cerrado: Closed              # PENDIENTE confirmar
    tipo-simulacion: simulacion             # las alertas con este type se excluyen (filtro _ne type)
    incluir-simulaciones: false
  # Refresco en segundo plano: el frontend pide cada 30 s y se le sirve desde memoria.
  refresco:
    intervalo: 30s              # entre el fin de un refresco y el inicio del siguiente
    espera-primera-carga: 20s   # una petición que llega antes del primer dato espera hasta esto; luego 503
    activo: true                # false apaga el refresco (lo usan las pruebas de la API)
    lista-en-segundo-plano: false   # true = el refresco también calcula la lista de alertas (consulta extra a TheHive cada ciclo)
  # Métricas de Wazuh: alertas de los últimos días guardadas en memoria (se leen del bloque JSON de la descripción).
  wazuh:
    dias-ventana: 7
    tamano-pagina: 500          # alertas por página en la carga inicial y en las sincronizaciones
    solape: 60s                 # en cada sincronización se retrocede esto desde la última alerta vista
    top-n: 10                   # tamaño de los rankings (IPs, usuarios, reglas, técnicas)
    tipo-alerta: wazuh          # type de las alertas que vienen de Wazuh
  # Activos atacados (GET /api/dashboard/activos), calculados desde la caché de Wazuh.
  activos:
    # Agentes de Wazuh conocidos: se reconocen por agente-id y, como respaldo, por nombre. Uno que no esté aquí sale como
    # "sin-clasificar" con su nombre técnico y el sistema deducido de sus alertas.
    inventario:
      - { agente-id: "000", nombre: wazuh-server,     tipo: monitoreo,     nombre-visible: "Servidor de monitoreo (Wazuh)", sistema: Linux }
      - { agente-id: "003", nombre: ip-172-31-20-112, tipo: base-de-datos, nombre-visible: "Servidor de base de datos",     sistema: Linux }
      - { agente-id: "004", nombre: ip-172-31-28-141, tipo: web,           nombre-visible: "Servidor web",                  sistema: Linux }
      - { agente-id: "001", nombre: linux-client,     tipo: estacion,      nombre-visible: "Estación de trabajo Linux",     sistema: Linux }
      - { agente-id: "002", nombre: EC2AMAZ-3RGFDQN,  tipo: windows,       nombre-visible: "Servidor Windows 1",            sistema: Windows }
      - { agente-id: "005", nombre: EC2AMAZ-N9EMRIA,  tipo: windows,       nombre-visible: "Servidor Windows 2",            sistema: Windows }
    # ORDENADA: a cada alerta se le asigna el PRIMER componente que coincida con sus grupos de regla; si ninguno, "otros".
    componentes:
      - { clave: base-de-datos,         grupos: [mariadb_lab, mysql, mssql, postgresql] }
      - { clave: servidor-web,          grupos: [web_server_lab, lab_webserver, apache, nginx, web] }
      - { clave: ssh,                   grupos: [sshd] }
      - { clave: inicio-sesion-windows, grupos: [windows_security] }
      - { clave: procesos-windows,      grupos: [sysmon], prefijos: [sysmon_] }
      - { clave: sistema-windows,       grupos: [windows_application, windows_system, WEF, win_evt_channel] }
      - { clave: cuentas-permisos,      grupos: [pam, sudo, adduser] }
      - { clave: auditoria,             grupos: [audit, audit_selinux, audit_configuration, apparmor] }
      - { clave: vulnerabilidades,      grupos: [vulnerability-detector, dpkg] }
      - { clave: integridad,            grupos: [rootcheck, syscheck] }
      - { clave: monitoreo-wazuh,       grupos: [ossec] }
    # No dicen QUÉ se atacó: nunca definen componente.
    grupos-genericos: [syslog, authentication_failed, invalid_login, authentication_success, authentication_failures,
                       config_changed, access_control, local, system_error, time_changed, stats, errors]
  # true = expone GET /diagnostico/wazuh/activos (solo nombres y conteos, solo desde 127.0.0.1). Apagado por defecto.
  diagnostico: ${DASHBOARD_DIAGNOSTICO:false}
