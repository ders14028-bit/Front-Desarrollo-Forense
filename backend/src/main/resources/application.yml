# Toda la configuración sensible sale de variables de entorno. Nada de esto contiene secretos.
spring:
  task:
    scheduling:
      pool:
        size: 3   # la carga inicial de Wazuh puede tardar y no debe frenar el refresco del resumen
  application:
    name: dashboard-soc-backend
  main:
    banner-mode: off
  mvc:
    log-request-details: false

server:
  # Solo escucha en la máquina local, salvo que se indique otra dirección (SERVER_ADDRESS).
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

dashboard:
  thehive:
    url: ${THEHIVE_URL:}                      # obligatoria, por ejemplo https://servidor:puerto
    api-key: ${THEHIVE_API_KEY:}              # obligatoria; NUNCA en este archivo
    organizacion: ${THEHIVE_ORG:escuelaing}   # fija: se envía en X-Organisation y el frontend no puede cambiarla
    limites:
      timeout-conexion: 5s
      timeout-lectura: 15s
      max-respuesta: 20MB        # una respuesta más grande se descarta: una consulta mal armada no debe tumbar la app
      max-consultas-simultaneas: 4
  cors:
    origenes: ${DASHBOARD_ORIGINS:http://localhost:5173}   # varios, separados por comas
  # SLA de atención en minutos por severidad (CLAUDE.md). Se expone en GET /api/dashboard/configuracion.
  sla-minutos:
    critica: 15
    alta: 30
    media: 120
    baja: 240
  # Nombres de TheHive de las reglas de negocio. Los marcados PENDIENTE hay que confirmarlos con el grupo de TheHive.
  negocio:
    grupo-contencion: Contención            # PENDIENTE confirmar
    estado-caso-confirmado: TruePositive    # PENDIENTE confirmar
    estado-tarea-completada: Completed      # PENDIENTE confirmar
    etapa-caso-nuevo: New                   # PENDIENTE confirmar
    etapa-caso-en-progreso: InProgress      # PENDIENTE confirmar
    etapa-caso-cerrado: Closed              # PENDIENTE confirmar
    tipo-simulacion: simulacion             # las alertas con este type se excluyen (filtro _ne type)
    incluir-simulaciones: false
  # Refresco en segundo plano: el frontend pide cada 30 s y se le sirve desde memoria.
  refresco:
    intervalo: 30s              # entre el fin de un refresco y el inicio del siguiente
    espera-primera-carga: 20s   # una petición que llega antes del primer dato espera hasta esto; luego 503
    activo: true                # false apaga el refresco (lo usan las pruebas de la API)
  # Métricas de Wazuh: alertas de los últimos días guardadas en memoria (se leen del bloque JSON de la descripción).
  wazuh:
    dias-ventana: 7
    tamano-pagina: 500          # alertas por página en la carga inicial y en las sincronizaciones
    solape: 60s                 # en cada sincronización se retrocede esto desde la última alerta vista
    top-n: 10                   # tamaño de los rankings (IPs, usuarios, reglas, técnicas)
    tipo-alerta: wazuh          # type de las alertas que vienen de Wazuh
